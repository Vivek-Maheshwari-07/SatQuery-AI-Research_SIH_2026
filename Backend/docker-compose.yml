services:
  backend:
    build: .
    container_name: satquery-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount the current directory into the container so that code changes sync live without rebuilding
      - .:/app
      # Mount the external data directory so the container can access the images
      - E:\SIH\DATA:/data
    environment:
      - ENV=development
      - SECRET_KEY=your_development_secret_key
    # Run uvicorn with live reload for development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
