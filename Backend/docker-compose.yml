services:
  backend:
    build: .
    container_name: satquery-backend
    ports:
      - "5000:5000"
    volumes:
      # Mount the current directory into the container so that code changes sync live without rebuilding
      - .:/app
    environment:
      - FLASK_ENV=development
      - FLASK_APP=run.py
      - SECRET_KEY=your_development_secret_key
    # Override gunicorn command for local development to use Flask's live reloading
    command: flask run --host=0.0.0.0 --port=5000
